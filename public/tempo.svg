<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tempoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#tempoBg)" />
  
  <g transform="translate(0, 0)" filter="url(#tShadow)">
    <!-- White border box around TEMPO like their print magazine header -->
    <rect x="80" y="160" width="352" height="150" rx="16" fill="none" stroke="#FFFFFF" stroke-width="12" />
    
    <!-- "TEMPO" text -->
    <text x="256" y="265" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" font-weight="900" letter-spacing="8" fill="#FFFFFF" text-anchor="middle">TEMPO</text>
    
    <text x="256" y="365" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#FFFFFF" text-anchor="middle">.CO</text>
  </g>
</svg>
